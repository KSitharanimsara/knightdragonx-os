name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck
    
    - name: Check installer script
      run: shellcheck scripts/installer.sh
      
    - name: Check post-install script
      run: shellcheck scripts/post-install.sh

  validate-markdown:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check markdown links
      run: |
        # Basic check for broken internal references
        grep -r "non-existent\|TODO\|FIXME" --include="*.md" . || true
