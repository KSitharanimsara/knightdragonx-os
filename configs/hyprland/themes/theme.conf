$COLOR_SCHEME = prefer-dark

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(FF0033FF) rgba(FFAA00FF) 45deg
    col.inactive_border = rgba(111111FF) rgba(222222FF) 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = rgba(FF0033FF) rgba(FFAA00FF) 45deg
    col.border_inactive = rgba(111111FF) rgba(222222FF) 45deg
    col.border_locked_active = rgba(FF0033FF) rgba(FFAA00FF) 45deg
    col.border_locked_inactive = rgba(111111FF) rgba(222222FF) 45deg
}

decoration {
    rounding = 16
    blur {
        enabled = yes
        size = 4
        passes = 2
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(FF00331A)
    }
}
